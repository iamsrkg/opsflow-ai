server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: opsflow-backend
  profiles:
    active: local

  datasource:
    url: jdbc:h2:mem:opsflowdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  flyway:
    enabled: false   # the in-memory profile lets Hibernate create the tables; PostgreSQL uses Flyway

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Events travel as JSON text; the envelope is built and parsed in code (see OutboxPublisher).
    consumer:
      group-id: opsflow-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all                      # wait for the broker to confirm the write
      properties:
        enable.idempotence: true     # a producer retry can't write the same record twice
        max.block.ms: 3000           # don't hang for a minute when the broker is down

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

opsflow:
  kafka:
    # Off by default so the app starts with nothing else running; events then wait in the outbox.
    # Set KAFKA_ENABLED=true when a broker is up (see infrastructure/docker-compose.yml).
    enabled: ${KAFKA_ENABLED:false}
  outbox:
    poll-ms: 2000
  vector:
    store: memory    # memory | pgvector (pgvector needs the PostgreSQL profile)
  rate-limit:
    # Needs Redis. Off by default so the app starts with nothing else running.
    enabled: ${RATE_LIMIT_ENABLED:false}
    login-per-minute: 10
    api-per-minute: 300
  security:
    jwt:
      secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration-ms: 86400000 # 24 hours
      refresh-expiration-ms: 604800000 # 7 days
  ai:
    # rules: keyword rules, no model, no network (the default)
    # openai: any chat-completions API (OpenAI, Ollama, ...); needs the three settings below
    provider: ${AI_PROVIDER:rules}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
    connect-timeout-seconds: 5
    read-timeout-seconds: ${AI_READ_TIMEOUT_SECONDS:60}   # a model that does not answer in time falls back to the rules
  embedding:
    # hash: feature hashing, no model, no network (the default)
    # model: an embedding model behind the same kind of API ("/embeddings"); 384 dimensions with PostgreSQL
    provider: ${EMBEDDING_PROVIDER:hash}
    model: ${EMBEDDING_MODEL:all-minilm}

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: ${RATE_LIMIT_ENABLED:false}   # only report on Redis when it is actually used
    # /actuator/health is UP only once the seed data is in and the runbooks are embedded,
    # not as soon as the web server answers
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: INFO
    com.opsflow: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

# The whole stack on Kubernetes:   kubectl apply -k k8s
# CI applies exactly this to a throwaway cluster and runs the smoke test against it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: opsflow
resources:
  - namespace.yaml
  - config.yaml
  - postgres.yaml
  - redis.yaml
  - kafka.yaml
  - backend.yaml
  - frontend.yaml
# Built locally and loaded into the cluster. For a real cluster, push the two images to a
# registry and point these at them.
images:
  - name: opsflow-backend
    newTag: local
  - name: opsflow-frontend
    newTag: local

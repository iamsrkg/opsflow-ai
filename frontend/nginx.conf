server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # the dashboard and the API share one origin, so the browser needs no CORS
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # the rate limiter counts per client, not per proxy
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # only the health check is exposed; metrics stay inside the network
    location = /actuator/health {
        proxy_pass http://backend:8080;
    }

    location / {
        try_files $uri /index.html;
    }
}

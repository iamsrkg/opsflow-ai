name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: maven}
      - run: mvn test
        working-directory: backend
  # Builds both images, starts the whole stack with Docker Compose and drives it from outside:
  # sign-in, a request through Kafka to a notification, pgvector search, approval rules, rate limit.
  full-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      # WITH_OUTAGE also stops Kafka mid-run and checks that the event waits and is delivered afterwards
      - run: WITH_OUTAGE=1 bash scripts/smoke.sh
      - if: failure()
        run: docker compose logs --tail=200
      - if: always()
        run: docker compose down -v
  # Starts the project the way the "Open in Codespaces" button does (the dev container brings the
  # stack up by itself), then runs the same smoke test inside it.
  codespace:
    runs-on: ubuntu-latest
    needs: full-stack
    steps:
      - uses: actions/checkout@v4
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            command -v jq > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq jq)
            bash scripts/smoke.sh
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
